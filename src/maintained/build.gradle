plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'net.micode.notes'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'net.micode.notes'
        minSdk 21
        targetSdk 25
        versionCode 1
        versionName '0.1'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            // 源码根目录是 src，默认会把 src/test 下的单元测试也当成主代码编译；
            // 这里显式排除，让单元测试走独立的 test 源集，从而能使用 testImplementation 依赖。
            java.exclude 'test/**'
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    useLibrary 'org.apache.http.legacy'

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 单元测试依赖：让 src/maintained/src/test 下的 JVM 单元测试可以独立运行，
    // 不改变打包产物，也不影响 release 构建。
    testImplementation 'junit:junit:4.13.2'
}
